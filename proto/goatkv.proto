syntax = "proto3";
package goatkv;

service GoatKVService {
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc MultiGet(MultiGetRequest) returns (MultiGetResponse);
  rpc Scan(ScanRequest) returns (ScanResponse);
  rpc CompareAndSet(CompareAndSetRequest) returns (CompareAndSetResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Flush(FlushRequest) returns (FlushResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc ReleaseSnapshot(ReleaseSnapshotRequest) returns (ReleaseSnapshotResponse);
}

message WriteRequest {
  bytes key = 1;
  bytes value = 2;
}

message WriteResponse {
  bool success = 1;
  string message = 2;
}

message GetRequest {
  bytes key = 1;
  uint64 snapshot_id = 2;
}

message GetResponse {
  bool success = 1;
  string message = 2;
  bytes value = 3;
}

message MultiGetRequest {
  repeated bytes keys = 1;
  uint64 snapshot_id = 2;
}

message MultiGetItem {
  bytes key = 1;
  bool found = 2;
  bytes value = 3;
  string message = 4;
}

message MultiGetResponse {
  bool success = 1;
  string message = 2;
  repeated MultiGetItem entries = 3;
}

message ScanRequest {
  bytes start_key = 1;
  bytes end_key = 2;
  bytes prefix = 3;
  uint32 limit = 4;
  bool reverse = 5;
  uint64 snapshot_id = 6;
}

message ScanItem {
  bytes key = 1;
  bytes value = 2;
}

message ScanResponse {
  bool success = 1;
  string message = 2;
  repeated ScanItem entries = 3;
}

message CompareAndSetRequest {
  bytes key = 1;
  bool expect_exists = 2;
  bytes expected_value = 3;
  bytes new_value = 4;
  bool delete_on_match = 5;
}

message CompareAndSetResponse {
  bool success = 1;
  string message = 2;
}

message UpdateRequest {
  bytes key = 1;
  bytes value = 2;
}

message UpdateResponse {
  bool success = 1;
  string message = 2;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

message FlushRequest {}

message FlushResponse {
  bool success = 1;
  string message = 2;
}

message CreateSnapshotRequest {}

message CreateSnapshotResponse {
  bool success = 1;
  string message = 2;
  uint64 snapshot_id = 3;
}

message ReleaseSnapshotRequest {
  uint64 snapshot_id = 1;
}

message ReleaseSnapshotResponse {
  bool success = 1;
  string message = 2;
}
