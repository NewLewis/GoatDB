syntax = "proto3";
package goatkv;

service GoatKVService {
  rpc Write (WriteRequest) returns (WriteResponse);
  rpc Get (GetRequest) returns (GetResponse);
}

message WriteRequest {
  bytes key = 1;
  bytes value = 2;
}

message WriteResponse {
  bool success = 1;
  string message = 2;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  bool success = 1;
  string message = 2;
  bytes value = 3;
}
