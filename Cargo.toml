[package]
name = "goat_db"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
crc32fast = "1.5"
tonic = "0.14.2"
prost = "0.14.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tonic-prost = "0.14.2"
simple_logger = "4.0"
clap = { version = "4.0", features = ["derive"] }
rustyline = "15.0.0"
bytes = "1.11.0"
twox-hash = "2.1.2"
ouroboros = "0.18.5"
rocksdb = { version = "0.24.0", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[features]
default = []
rocksdb = ["dep:rocksdb"]

[dev-dependencies]
tempfile = "3.10"
# E2E 测试框架
tokio-test = "0.4"
assert_cmd = "2.0"
predicates = "3.1"
ntest = "0.9"
rand = "0.8"

# ===========================================================================
# Integration Tests Configuration
# ===========================================================================
#
# Note: Tests in the tests/ directory are auto-discovered ONLY if they are
# direct children. Tests in subdirectories (e.g., tests/e2e/) must be
# explicitly configured here.
#
# Organization:
# - tests/common/       - Shared test utilities and fixtures
# - tests/e2e/          - End-to-end integration tests
# - tests/integration/  - Integration tests for specific components
# - benches/            - Bench targets (cargo bench)
#
# Running tests:
# - cargo test              - Run all tests
# - cargo test --test <name> - Run specific test target
# - cargo test e2e          - Run all tests matching "e2e"
# ===========================================================================

# ========== E2E Tests ==========
# Full system integration tests

[[test]]
name = "e2e_basic_crud"
path = "tests/e2e/basic_crud_test.rs"
harness = true

[[test]]
name = "e2e_multi_client"
path = "tests/e2e/multi_client_test.rs"
harness = true

[[test]]
name = "e2e_edge_cases"
path = "tests/e2e/edge_cases_test.rs"
harness = true

[[test]]
name = "integration_recovery"
path = "tests/integration/recovery_test.rs"
harness = true

[[test]]
name = "integration_shard_basic"
path = "tests/integration/shard_basic_test.rs"
harness = true

[[test]]
name = "integration_shard_recovery"
path = "tests/integration/shard_recovery_test.rs"
harness = true

# ========== Integration Tests ==========
# Component-level integration tests
# Uncomment and add more as needed:
#
# [[test]]
# name = "integration_storage"
# path = "tests/integration/storage_test.rs"
# harness = true

# ========== Bench Targets ==========
# Bench-style binaries (no test harness)

[[bench]]
name = "goatkv_bench"
path = "benches/goatkv_bench.rs"
harness = false

[build-dependencies]
tonic-prost-build = "0.14.2"


[profile.release]
debug = true  # 开启调试符号，这不会影响性能，只会增加二进制文件大小
strip = false # 确保不剔除符号表

[profile.dev]
debug = true
