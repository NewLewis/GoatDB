[package]
name = "goat_db"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
crc32fast = "1.5"
tonic = "0.14.2"
prost = "0.14.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tonic-prost = "0.14.2"
env_logger = "0.11"
simple_logger = "4.0"
clap = { version = "4.0", features = ["derive"] }


[dev-dependencies]
tempfile = "3.10"

[build-dependencies]
tonic-prost-build = "0.14.2"
