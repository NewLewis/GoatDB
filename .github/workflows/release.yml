name: Release

on:
  push:
    tags:
      - "v*"

# 1. 关键修复：添加写权限，解决报错问题
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 如果其中一个平台失败，不要取消其他平台的构建
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: goat_db
            asset_name: goat_db-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: goat_db.exe
            asset_name: goat_db-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: goat_db
            asset_name: goat_db-macos-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        if: ${{ matrix.os != 'windows-latest' }}
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      # 2. 新增步骤：在本地重命名文件
      # softprops 插件上传时会直接使用文件名，所以我们先改成目标名字
      # 使用 shell: bash 确保在 Windows 上也能用 mv 命令
      - name: Rename binary for release
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          mv ${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      # 3. 替换步骤：使用 softprops/action-gh-release 发布
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          # 如果你想自动生成 Release Notes，可以取消下面这行的注释
          # generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
