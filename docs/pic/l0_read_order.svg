<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      .box { fill: #f5f7fb; stroke: #2f3b52; stroke-width: 2.4; }
      .text { font: 15px "Helvetica Neue", Arial, sans-serif; fill: #1c2433; }
      .arrow { stroke: #2f3b52; stroke-width: 2.4; fill: none; marker-end: url(#arrow); stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3b52" />
    </marker>
  </defs>

  <text class="text" x="40" y="40">L0 file list (append order)</text>

  <rect class="box" x="40" y="70" width="180" height="60" rx="8" />
  <text class="text" x="70" y="105">Oldest SST</text>

  <rect class="box" x="260" y="70" width="180" height="60" rx="8" />
  <text class="text" x="300" y="105">Older SST</text>

  <rect class="box" x="480" y="70" width="180" height="60" rx="8" />
  <text class="text" x="520" y="105">Newer SST</text>

  <rect class="box" x="700" y="70" width="180" height="60" rx="8" />
  <text class="text" x="740" y="105">Newest SST</text>

  <path class="arrow" d="M880 160 L720 160 L720 130" />
  <text class="text" x="740" y="190">read newest-first</text>
</svg>
